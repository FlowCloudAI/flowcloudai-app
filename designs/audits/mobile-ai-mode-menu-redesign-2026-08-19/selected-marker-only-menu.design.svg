<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
  <title>FlowCloudAI 移动端 AI 模式选择菜单 · Marker-Only 修订稿</title>
  <desc>方案 2 的可编辑矢量设计文件，包含移动端上下文、组件放大图、尺寸和 Token 映射。</desc>
  <defs>
    <filter id="panel-shadow" x="-24%" y="-24%" width="148%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#181b20" flood-opacity="0.09"/>
    </filter>
    <filter id="soft-shadow" x="-16%" y="-16%" width="132%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#181b20" flood-opacity="0.07"/>
    </filter>

    <g id="reader-icon" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 8.8C10 7.2 7.6 6.4 4.7 6.4v10.3c2.9 0 5.3.8 7.3 2.5Z"/>
      <path d="M12 8.8c2-1.6 4.4-2.4 7.3-2.4v10.3c-2.9 0-5.3.8-7.3 2.5Z"/>
      <path d="M12 8.8v10.4"/>
    </g>
    <g id="assistant-icon" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.6 19 6.3v5.2c0 4.3-2.8 7.3-7 8.9-4.2-1.6-7-4.6-7-8.9V6.3Z"/>
      <path d="m8.4 11.9 2.3 2.3 4.9-4.9"/>
    </g>
    <g id="writer-icon" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="m5 19 1.2-4.7L15.5 5a1.6 1.6 0 0 1 2.3 0L19 6.2a1.6 1.6 0 0 1 0 2.3l-9.3 9.3Z"/>
      <path d="m14.4 6.1 3.5 3.5M6.2 14.3l3.5 3.5M5 19l4.7-1.2"/>
    </g>
    <g id="thinking-icon" fill="#3489e5" stroke="#3489e5" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13.3 3.5 6.9 12.6h4.9l-1.1 7.9 6.4-9.4h-4.8Z"/>
    </g>
    <g id="plain-check" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 5 4.2 8.2 11 1.4"/>
    </g>

    <!-- 156 × 164：真实组件尺寸。所有文字均保持可编辑。 -->
    <g id="mode-menu">
      <rect width="156" height="164" rx="14" fill="#fffefc" stroke="#dce1e7" filter="url(#soft-shadow)"/>
      <rect x="0" y="64" width="2" height="36" rx="1" fill="#3489e5"/>

      <g transform="translate(8 15) scale(.9167)" color="#24282e"><use href="#reader-icon"/></g>
      <text x="42" y="20" fill="#24282e" font-size="14" font-weight="500">读者模式</text>
      <text x="42" y="38" fill="#737b86" font-size="11.5">只读取资料</text>

      <g transform="translate(8 67) scale(.9167)" color="#3489e5"><use href="#assistant-icon"/></g>
      <text x="42" y="72" fill="#3489e5" font-size="14" font-weight="500">助手模式</text>
      <g transform="translate(102 63)" color="#3489e5"><use href="#plain-check"/></g>
      <text x="42" y="90" fill="#737b86" font-size="11.5">写入前确认</text>

      <g transform="translate(8 119) scale(.9167)" color="#24282e"><use href="#writer-icon"/></g>
      <text x="42" y="124" fill="#24282e" font-size="14" font-weight="500">作家模式</text>
      <text x="42" y="142" fill="#737b86" font-size="11.5">写入免确认</text>
    </g>

    <style>
      text { font-family: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; }
      .eyebrow { fill: #3489e5; font-size: 14px; font-weight: 650; letter-spacing: 1.2px; }
      .title { fill: #181b20; font-size: 30px; font-weight: 700; }
      .subtitle { fill: #66707d; font-size: 15px; }
      .section-title { fill: #181b20; font-size: 18px; font-weight: 650; }
      .label { fill: #66707d; font-size: 13px; font-weight: 600; }
      .value { fill: #181b20; font-size: 14px; font-weight: 500; }
      .note { fill: #66707d; font-size: 13px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <rect width="1600" height="1600" fill="#f3f5f8"/>
  <text x="64" y="58" class="eyebrow">FLOWCLOUDAI · MOBILE AI</text>
  <text x="64" y="96" class="title">模式选择菜单 · Marker-Only 修订稿</text>
  <text x="970" y="92" class="subtitle">设计状态：已接入共用移动端代码 · Android 真机验证 · 2026-08-19</text>

  <!-- 左：390 × 844 移动端上下文，按 0.86 缩放展示。 -->
  <rect x="64" y="132" width="430" height="884" rx="24" fill="#ffffff" stroke="#dce1e7"/>
  <text x="92" y="174" class="section-title">移动端上下文</text>
  <text x="92" y="197" class="note">390 × 844 画面，预览缩放至 86%</text>
  <g transform="translate(111 220) scale(.86)">
    <rect width="390" height="844" rx="20" fill="#fbfaf8" stroke="#dce1e7"/>

    <g transform="translate(20 24)">
      <circle cx="28" cy="28" r="26" fill="#fffefc" stroke="#dce1e7"/>
      <path d="M17 21h22M17 28h22M17 35h22" fill="none" stroke="#3489e5" stroke-width="2.3" stroke-linecap="round"/>
      <rect x="72" width="206" height="56" rx="28" fill="#fffefc" stroke="#dce1e7"/>
      <text x="92" y="34" fill="#3489e5" font-size="16" font-weight="600">deepseek-v4-flash</text>
      <path d="m252 24 7 7 7-7" fill="none" stroke="#3489e5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="294" width="76" height="56" rx="28" fill="#fffefc" stroke="#dce1e7"/>
      <path d="M316 28h22M327 17v22" fill="none" stroke="#83b6ec" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="351" cy="28" r="2.2" fill="#83b6ec"/><circle cx="359" cy="28" r="2.2" fill="#83b6ec"/><circle cx="367" cy="28" r="2.2" fill="#83b6ec"/>
    </g>

    <text x="195" y="300" text-anchor="middle" fill="#181b20" font-size="26" font-weight="650">开始 AI 对话</text>
    <text x="195" y="334" text-anchor="middle" fill="#737b86" font-size="15">与 AI 讨论世界观设定、资料整理和后续创作。</text>

    <g transform="translate(109 464)"><use href="#mode-menu"/></g>

    <g transform="translate(16 638)">
      <rect width="358" height="150" rx="26" fill="#fffefc" stroke="#dce1e7"/>
      <text x="24" y="40" fill="#737b86" font-size="16">发消息或按住说话</text>
      <g transform="translate(24 100)">
        <rect width="78" height="34" rx="17" fill="#f5f9fe" stroke="#b6d8f7"/>
        <g transform="translate(10 7) scale(.72)"><use href="#thinking-icon"/></g>
        <text x="33" y="22" fill="#3489e5" font-size="14" font-weight="550">思考</text>
      </g>
      <g transform="translate(272 100)">
        <circle cx="17" cy="17" r="16" fill="none" stroke="#181b20" stroke-width="1.6"/>
        <path d="M10 17h14M17 10v14" stroke="#181b20" stroke-width="2" stroke-linecap="round"/>
      </g>
      <g transform="translate(318 100)">
        <circle cx="17" cy="17" r="17" fill="#a9cff4"/>
        <path d="M17 24V10m0 0-7 7m7-7 7 7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <line x1="0" y1="796" x2="390" y2="796" stroke="#e4e7eb"/>
    <g fill="none" stroke="#737b86" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M42 819 56 807l14 12v11H60v-8h-8v8H42Z"/>
      <path d="M185 811c5 2 8 5 10 10 2-5 5-8 10-10-5-2-8-5-10-10-2 5-5 8-10 10Z" stroke="#3489e5"/>
      <path d="m283 828 3-11 12-12 5 5-12 12Z"/>
      <circle cx="342" cy="814" r="10"/><circle cx="342" cy="814" r="3"/>
    </g>
    <text x="56" y="840" text-anchor="middle" fill="#737b86" font-size="11">首页</text>
    <text x="195" y="840" text-anchor="middle" fill="#3489e5" font-size="11">AI</text>
    <text x="292" y="840" text-anchor="middle" fill="#737b86" font-size="11">灵感</text>
    <text x="342" y="840" text-anchor="middle" fill="#737b86" font-size="11">设置</text>
  </g>

  <!-- 右上：组件放大与关键尺寸。 -->
  <rect x="526" y="132" width="1010" height="520" rx="24" fill="#ffffff" stroke="#dce1e7"/>
  <text x="558" y="176" class="section-title">组件放大检查</text>
  <text x="558" y="199" class="note">左侧细标记 + 主色语义 + 普通对钩；无整行底色、无粗体</text>

  <g transform="translate(590 230) scale(2.35)"><use href="#mode-menu"/></g>

  <line x1="590" y1="626" x2="957" y2="626" stroke="#9aa4b0" stroke-width="1"/>
  <line x1="590" y1="620" x2="590" y2="632" stroke="#9aa4b0"/>
  <line x1="957" y1="620" x2="957" y2="632" stroke="#9aa4b0"/>
  <text x="773.5" y="646" text-anchor="middle" class="note">156px 浮层宽度</text>

  <g transform="translate(1050 244)">
    <text class="label" y="0">对钩</text>
    <text class="value" y="25">普通 SVG · 无容器</text>
    <text class="note" y="48">标题后 4px（--mobile-gap-text）</text>

    <text class="label" y="94">选中态</text>
    <text class="value" y="119">仅保留三种信号</text>
    <text class="note" y="142">左标记 / 主色图标与标题 / 对钩</text>

    <text class="label" y="188">图标</text>
    <text class="value" y="213">22px · 1.7px 描边</text>
    <text class="note" y="236">放大轮廓，保持描边粗细不变</text>

    <text class="label" y="282">文字</text>
    <text class="value" y="307">14px / 11.5px</text>
    <text class="note" y="330">名称 500 · 说明 regular</text>
  </g>

  <!-- 右下：实现映射与内容约束。 -->
  <rect x="526" y="676" width="1010" height="340" rx="24" fill="#ffffff" stroke="#dce1e7"/>
  <text x="558" y="720" class="section-title">实现规格</text>
  <line x1="558" y1="744" x2="1504" y2="744" stroke="#e4e7eb"/>

  <g transform="translate(558 780)">
    <text class="label">几何</text>
    <text x="118" class="value">156 × 164px · 14px 圆角 · 1px 边框 · 52px 行高</text>
    <text y="34" class="label">横向节奏</text>
    <text x="118" y="34" class="value">8px 行内边距 · 8px 图标文字间距 · 4px 标题对钩间距</text>
    <text y="68" class="label">颜色</text>
    <text x="118" y="68" class="value mono">--mobile-surface-menu / --mobile-border-color / --fc-color-primary</text>
    <text y="102" class="label">辅助文字</text>
    <text x="118" y="102" class="value mono">--fc-color-text-secondary</text>
    <text y="136" class="label">命中区</text>
    <text x="118" y="136" class="value">可视行高 52px，满足移动端最小 48px 触摸基线</text>
    <text y="170" class="label">精确文案</text>
    <text x="118" y="170" class="value">读者模式 / 只读取资料 · 助手模式 / 写入前确认</text>
    <text x="118" y="192" class="value">作家模式 / 写入免确认</text>
    <text y="226" class="label">禁止项</text>
    <text x="118" y="226" class="value">圆形对钩容器 · 选中行底色 · 粗体标题 · 独立尾部网格列</text>
  </g>

  <!-- 底部：验收维度和确定性导出说明，补齐方形审阅画布。 -->
  <rect x="64" y="1048" width="1472" height="470" rx="24" fill="#ffffff" stroke="#dce1e7"/>
  <text x="96" y="1094" class="section-title">交付与验收</text>
  <line x1="96" y1="1118" x2="1504" y2="1118" stroke="#e4e7eb"/>

  <g transform="translate(96 1160)">
    <text class="eyebrow">VISUAL</text>
    <text y="42" class="value">普通对钩紧跟“助手模式”</text>
    <text y="70" class="note">无圆形容器、无 badge、无独立尾部列</text>
    <text y="112" class="value">选中行保持透明</text>
    <text y="140" class="note">不使用整行蓝色或状态色填充</text>
    <text y="182" class="value">视觉重量降低</text>
    <text y="210" class="note">22px 图标 · 1.7px 描边 · 500 字重</text>
  </g>

  <g transform="translate(555 1160)">
    <text class="eyebrow">INTERACTION</text>
    <text y="42" class="value">三行均保留 52px 可视高度</text>
    <text y="70" class="note">满足 48px 最小触摸目标，不靠放大内容凑面积</text>
    <text y="112" class="value">选中状态不只依赖颜色</text>
    <text y="140" class="note">左侧标记与普通对钩同时提供形状提示</text>
    <text y="182" class="value">打开菜单时不改变模式</text>
    <text y="210" class="note">点击具体行后才更新当前模式并关闭浮层</text>
  </g>

  <g transform="translate(1020 1160)">
    <text class="eyebrow">TOKENS &amp; PLATFORM</text>
    <g transform="translate(0 30)">
      <circle cx="10" cy="10" r="10" fill="#3489e5"/>
      <text x="30" y="15" class="value mono">--fc-color-primary</text>
    </g>
    <g transform="translate(0 70)">
      <circle cx="10" cy="10" r="10" fill="#fffefc" stroke="#dce1e7"/>
      <text x="30" y="15" class="value mono">--mobile-surface-menu</text>
    </g>
    <g transform="translate(0 110)">
      <circle cx="10" cy="10" r="10" fill="#737b86"/>
      <text x="30" y="15" class="value mono">--fc-color-text-secondary</text>
    </g>
    <text y="182" class="value">iOS 与 Android 共用移动端实现</text>
    <text y="210" class="note">设计不改变桌面端 AI 权限菜单</text>
  </g>

  <rect x="96" y="1430" width="1408" height="56" rx="14" fill="#f7f9fc" stroke="#e4e7eb"/>
  <text x="120" y="1464" class="note">Source: direction-marker-only-revised.png · Editable SVG master · UI copy, paths, dimensions and export are deterministic.</text>
  <text x="64" y="1570" class="note">FlowCloudAI design audit · selected-marker-only-menu.design.svg</text>
</svg>
