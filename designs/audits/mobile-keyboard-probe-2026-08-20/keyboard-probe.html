<!doctype html>
<!--
  移动端键盘行为探针。

  用途：在应用真实的 WKWebView / Android WebView 里，测定「键盘出现时到底是谁改了什么」，
  为下一版键盘架构提供唯一真值。它只观测、不干预：不在触摸路径中调用 focus()、不 preventDefault，
  避免复现 2026-08-20 打断键盘事务的问题（B 档预抬升是唯一的例外，且只改 CSS 变量）。

  两种页面结构必须分别验证——AI 会话页有常驻 composer，灵感页没有，
  正文 textarea 自己就是那个 1fr 项、由它自己的内部滚动负责光标可见。
  混在一起测会得出错误结论。
-->
<head>
    <meta charset="utf-8"/>
    <script>
        /* viewport meta 必须在解析期就位，因此按 ?vw= 参数在此写入，页内按钮通过重载切换。 */
        (function () {
            var q = location.search
            var mode = (q.match(/vw=([a-z]+)/) || [])[1] || 'content'
            var fix = (q.match(/fix=(\d)/) || [])[1] || '0'
            var page = (q.match(/page=([a-z]+)/) || [])[1] || 'ai'
            var widget = mode === 'visual' ? 'resizes-visual'
                : mode === 'content' ? 'resizes-content'
                    : 'overlays-content'
            window.__probeMode = mode
            window.__probeFix = fix
            window.__probePage = page
            document.documentElement.setAttribute('data-fix', fix)
            document.documentElement.setAttribute('data-page', page)
            document.write(
                '<meta name="viewport" content="width=device-width, initial-scale=1.0, '
                + 'maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, '
                + 'interactive-widget=' + widget + '">'
            )
        })()
    </script>
    <title>键盘行为探针</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #14161a;
            color: #e7ebf0;
            font: 13px/1.5 -apple-system, "SF Pro Text", "Noto Sans SC", system-ui, sans-serif;
        }

        /* 外壳默认铺满布局视口；A/B 档会改写 top 与 height。用 flex 而不是 grid，
           这样隐藏面板或切换页面结构都不需要改行模板。 */
        #shell {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
        }
        #shell > * { flex: 0 0 auto; }
        #scroller, #ideaBody { flex: 1 1 0; min-height: 0; }

        /*
         * A 档补偿：外壳贴合可见视口。
         * top 抵消 WebKit 的 focus reveal 平移，height 只取键盘上方的可见高度。
         * transition 只给 height——top 在跟随一个正在进行的原生滚动，加过渡就是加延迟。
         */
        [data-fix="1"] #shell,
        [data-fix="2"] #shell,
        [data-fix="3"] #shell,
        [data-fix="4"] #shell {
            top: var(--kb-reveal, 0px);
            bottom: auto;
            height: var(--kb-visible, 100%);
        }
        [data-fix="1"] #shell { transition: height 220ms ease-out; }
        [data-fix="3"] #shell, [data-fix="4"] #shell { transition: none; }

        /* 可见区放不下 Tab；A 档接受隐藏，B 档才追求「被键盘盖住」。 */
        [data-fix="1"][data-kb="on"] #tabbar,
        [data-fix="2"][data-kb="on"] #tabbar,
        [data-fix="3"][data-kb="on"] #tabbar,
        [data-fix="4"][data-kb="on"] #tabbar,
        [data-fix="5"][data-kb="on"] #tabbar { display: none; }

        /* 页面结构切换 */
        [data-page="ai"] #ideaMeta, [data-page="ai"] #ideaBody { display: none; }
        [data-page="idea"] #scroller, [data-page="idea"] #composer { display: none; }
        body.panel-off #controls { display: none; }
        [data-kb="on"] #controls { display: none; }

        #topbar {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px;
            background: #2b6cff;
            color: #fff;
            z-index: 3;
        }
        #topbar .grow { flex: 1 1 auto; min-width: 0; }
        #topbar b { display: block; font-size: 13px; }
        #topbar small { display: block; font-weight: 400; opacity: .85; font-size: 11px; }

        #controls { padding: 8px 12px; background: #191d24; border-bottom: 1px solid #303845; }
        #controls .lab { color: #8fa0b6; font-size: 11px; margin: 0 0 3px; }

        #scroller { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 12px 16px; }

        /* 灵感页：固定元数据 + 正文独占剩余高度、内部滚动，底部没有 composer。 */
        #ideaMeta { padding: 10px 12px; border-bottom: 1px solid #303845; background: #191d24; }
        #ideaMeta .t { font-size: 16px; font-weight: 600; }
        #ideaMeta .s { color: #8fa0b6; font-size: 11px; }
        #ideaBody {
            width: 100%;
            border: 0;
            border-radius: 0;
            background: #14161a;
            padding: 12px;
            overflow-y: auto;
        }

        #composer {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            background: #1d2026;
            border-top: 1px solid #333a45;
            z-index: 2;
        }
        #composer textarea { flex: 1; }

        /* 模拟底部 Tab：观察它是被键盘盖住，还是被顶到键盘上方。 */
        #tabbar {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 52px;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            background: #7a3cff;
            color: #fff;
            font-weight: 600;
            z-index: 1;
        }

        textarea {
            width: 100%;
            background: #0e1013;
            color: #e7ebf0;
            border: 1px solid #3a424f;
            border-radius: 8px;
            padding: 8px;
            font: inherit;
            resize: none;
        }
        #bigInput { height: 46vh; }
        #smallInput { height: 38px; }

        button {
            background: #2a3340;
            color: #e7ebf0;
            border: 1px solid #46526180;
            border-radius: 8px;
            padding: 6px 9px;
            font: inherit;
            font-size: 12px;
        }
        button.on { background: #2b6cff; border-color: #2b6cff; }
        button.copy { background: #1f9d55; border-color: #1f9d55; font-weight: 600; }

        .row { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 7px; }
        .row:last-child { margin-bottom: 0; }
        .card { border: 1px solid #303845; border-radius: 10px; padding: 10px; margin: 0 0 10px; background: #191d24; }
        .card h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: .04em; color: #8fa0b6; text-transform: uppercase; }
        #live { font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; overflow-x: auto; }
        #report { font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; max-height: 26vh; overflow: auto; -webkit-user-select: text; user-select: text; }

        /* 单位探针：只用于读取计算值，不参与可见布局。 */
        .unit { position: absolute; left: -9999px; top: 0; width: 1px; }
        #u-vh { height: 100vh } #u-svh { height: 100svh } #u-lvh { height: 100lvh } #u-dvh { height: 100dvh }
        #u-fixed { position: fixed; inset: 0; visibility: hidden; pointer-events: none; }
        /* 12345px 哨兵：env 不被支持或未设置时回退到它，可与真实 0 区分。 */
        #u-kbenv { height: 1px; padding-bottom: env(keyboard-inset-height, 12345px); }
        #u-safe { height: 1px; padding-bottom: env(safe-area-inset-bottom, 12345px); }
    </style>
</head>
<body class="panel-off">
<div id="shell">
    <div id="topbar">
        <span class="grow">
            <b>固定顶栏 — 必须永远可见</b>
            <small id="modeLabel"></small>
        </span>
        <button class="copy" id="copyBtn">复制</button>
        <button id="panelBtn">开面板</button>
    </div>

    <div id="controls">
        <div class="lab">页面结构</div>
        <div class="row" id="pageRow"></div>
        <div class="lab">补偿档位</div>
        <div class="row" id="fixRow"></div>
        <div class="lab">视口模式</div>
        <div class="row" id="modeRow"></div>
        <div class="lab">人工记录（收起键盘后再点）</div>
        <div class="row">
            <button data-mark="顶栏还在">顶栏还在</button>
            <button data-mark="顶栏跑了">顶栏跑了</button>
            <button data-mark="顶栏闪了一下">顶栏闪了一下</button>
        </div>
        <div class="row">
            <button data-mark="Tab没了">Tab没了</button>
            <button data-mark="Tab被顶上来">Tab被顶上来</button>
            <button data-mark="键盘上方有缝">键盘上方有缝</button>
            <button data-mark="点击落空">点击落空</button>
        </div>
    </div>

    <div id="scroller">
        <div class="card">
            <h3>大输入区（AI 结构里的长内容）</h3>
            <textarea id="bigInput" placeholder="点这里 — 比键盘上方可视区更高"></textarea>
        </div>
        <div class="card">
            <h3>实时读数</h3>
            <div id="live"></div>
        </div>
        <div class="card">
            <h3>已采集</h3>
            <div id="report">（还没有记录）</div>
        </div>
    </div>

    <div id="composer">
        <textarea id="smallInput" placeholder="点这里 — 模拟 AI composer"></textarea>
    </div>

    <div id="ideaMeta">
        <div class="t">灵感标题</div>
        <div class="s">项目：示例世界观 · 状态：草稿</div>
    </div>
    <textarea id="ideaBody" placeholder="点这里 — 灵感正文：独占剩余高度，内部滚动，下面没有 composer"></textarea>

    <div id="tabbar">底部 Tab</div>
</div>

<div class="unit" id="u-vh"></div>
<div class="unit" id="u-svh"></div>
<div class="unit" id="u-lvh"></div>
<div class="unit" id="u-dvh"></div>
<div class="unit" id="u-kbenv"></div>
<div class="unit" id="u-safe"></div>
<div id="u-fixed"></div>

<script>
(function () {
    'use strict'

    var MODE = window.__probeMode
    var FIX = window.__probeFix || '0'
    var PAGE = window.__probePage || 'ai'

    var MODES = [['content', 'content'], ['visual', 'visual'], ['overlays', 'overlays'], ['vk', 'vk']]
    var FIXES = [['5', '原生frame'], ['0', 'off'], ['1', 'A档·硬切换'], ['2', 'A档·逐帧'],
        ['3', 'B档·down'], ['4', 'B档·up']]
    var PAGES = [['ai', 'AI（有 composer）'], ['idea', '灵感（无 composer）']]

    var vv = window.visualViewport || null
    /* 布局视口高度不随键盘变化（实测恒定），可安全缓存，仅横竖屏切换时刷新。 */
    var layoutH = document.documentElement.clientHeight
    /* fix=5 下布局视口会被原生改变，必须留一个加载时的基准来算遮挡。 */
    var baseLayoutH = layoutH
    /* B 档要在聚焦前把输入区抬到键盘上方，因此必须先由前一次键盘学到遮挡高度。 */
    var cachedInset = 0
    var preliftTimer = null

    var records = []
    var taps = 0
    var tapsWithKeyboard = 0
    var pendingTapAt = 0

    var vkSupported = !!(navigator.virtualKeyboard)
    var vkEnabled = false
    if (MODE === 'vk' && vkSupported) {
        try { navigator.virtualKeyboard.overlaysContent = true; vkEnabled = true } catch (e) { vkEnabled = false }
    }

    function px(el, prop) { return Math.round(parseFloat(getComputedStyle(el)[prop]) * 100) / 100 }
    function r(n) { return n == null ? null : Math.round(n * 100) / 100 }
    function rectTop(id) {
        var el = document.getElementById(id)
        if (!el || getComputedStyle(el).display === 'none') return null
        return r(el.getBoundingClientRect().top)
    }
    function isTextEditor(el) {
        return !!(el && el.matches && el.matches('input, textarea, [contenteditable]:not([contenteditable="false"])'))
    }

    function quick() {
        return {
            vvH: vv ? r(vv.height) : null,
            vvOff: vv ? r(vv.offsetTop) : null,
            docH: document.documentElement.clientHeight,
            top: rectTop('topbar'),
            tab: rectTop('tabbar'),
            kbEnv: px(document.getElementById('u-kbenv'), 'paddingBottom'),
            scrollY: r(window.scrollY)
        }
    }

    function full() {
        var q = quick()
        return {
            innerH: window.innerHeight,
            docH: q.docH,
            fixedH: r(document.getElementById('u-fixed').getBoundingClientRect().height),
            vh: px(document.getElementById('u-vh'), 'height'),
            svh: px(document.getElementById('u-svh'), 'height'),
            lvh: px(document.getElementById('u-lvh'), 'height'),
            dvh: px(document.getElementById('u-dvh'), 'height'),
            vvH: q.vvH,
            vvOff: q.vvOff,
            kbEnv: q.kbEnv,
            safeBottom: px(document.getElementById('u-safe'), 'paddingBottom'),
            topbarTop: q.top,
            tabTop: q.tab,
            composerTop: rectTop('composer'),
            ideaBodyTop: rectTop('ideaBody'),
            ideaBodyH: (function () {
                var el = document.getElementById('ideaBody')
                return getComputedStyle(el).display === 'none' ? null : r(el.getBoundingClientRect().height)
            })(),
            scrollY: q.scrollY
        }
    }

    /* ---- A / B 档补偿 ---- */

    function computeKb() {
        if (!vv) return null
        var h = vv.height
        /* 动画中途出现过 vv.height=0 的坏帧，直接用会算出整屏遮挡并闪一下。 */
        if (!(h > 100)) return null
        return {
            visible: r(h),
            reveal: r(vv.offsetTop || 0),
            inset: Math.max(0, r(layoutH - h))
        }
    }

    function applyReveal() {
        if (FIX === '0' || FIX === '5' || !vv) return
        document.documentElement.style.setProperty('--kb-reveal', (vv.offsetTop || 0) + 'px')
    }

    function applyHeight(k) {
        if (!k) return
        var root = document.documentElement
        root.style.setProperty('--kb-visible', k.visible + 'px')
        root.style.setProperty('--kb-inset', k.inset + 'px')
        var on = k.inset > 100
        root.setAttribute('data-kb', on ? 'on' : 'off')
        if (on) {
            cachedInset = k.inset
            /* 键盘收起时不能滚——否则会把长内容顶到贴着顶栏。 */
            revealFocusedInScroller()
        }
    }

    /*
     * 抵消整页平移的同时也抵消了 WebKit「让光标可见」的那一半，
     * 所以 AI 结构的滚动区要自己把聚焦元素滚回可见范围。只动 #scroller，不碰 document。
     * 灵感结构不需要：正文 textarea 自己就是 1fr 项，由它的内部滚动负责。
     */
    function revealFocusedInScroller() {
        var el = document.activeElement
        var sc = document.getElementById('scroller')
        if (PAGE !== 'ai' || !el || !sc || el === document.body || !sc.contains(el)) return
        var a = el.getBoundingClientRect()
        var b = sc.getBoundingClientRect()
        if (a.height >= b.height) sc.scrollTop += (a.top - b.top) - 8
        else if (a.bottom > b.bottom) sc.scrollTop += (a.bottom - b.bottom) + 8
        else if (a.top < b.top) sc.scrollTop -= (b.top - a.top) + 8
    }

    var settleTimer = null

    function onVvScroll() { applyReveal(); paintLive() }

    function onVvResize() {
        applyReveal()
        paintLive()
        if (FIX === '0' || FIX === '5') return
        var k = computeKb()
        if (!k) return
        if (FIX === '2') { clearTimeout(settleTimer); applyHeight(k); return }
        if ((FIX === '3' || FIX === '4') && k.inset > 100) { clearTimeout(settleTimer); applyHeight(k); return }
        var cur = parseFloat(document.documentElement.style.getPropertyValue('--kb-visible')) || layoutH
        clearTimeout(settleTimer)
        if (k.visible > cur + 1) { applyHeight(k); return }   /* 键盘收起：立即恢复 */
        settleTimer = setTimeout(function () { applyHeight(computeKb()) }, 180)
    }

    /*
     * B 档：用上一次学到的键盘高度，在聚焦前把输入区抬到键盘上方，
     * 让 WebKit 的 reveal 算出 0 位移。只改 CSS 变量，不调用 focus()、不 preventDefault。
     * 已知风险：抬升会把控件从手指下方移走，这次点击可能落空——点击统计会反映出来。
     */
    function prelift(event) {
        if (!cachedInset || !isTextEditor(event.target)) return
        var root = document.documentElement
        root.style.setProperty('--kb-visible', (layoutH - cachedInset) + 'px')
        root.style.setProperty('--kb-inset', cachedInset + 'px')
        root.setAttribute('data-kb', 'on')
        clearTimeout(preliftTimer)
        preliftTimer = setTimeout(function () {
            if (!isTextEditor(document.activeElement)) applyHeight(computeKb())
        }, 700)
    }

    /* ---- 点击统计：必须数点击而不是 focusin，否则落空的点击不进分母 ---- */
    document.addEventListener('pointerdown', function (e) {
        if (!isTextEditor(e.target) || e.target === document.activeElement) return
        taps++
        pendingTapAt = performance.now()
        paintLive()
    }, {capture: true, passive: true})

    /* fix=5 由原生独占键盘布局，Web 侧不预抬升、不补偿。 */
    if (FIX === '3') document.addEventListener('pointerdown', prelift, {capture: true, passive: true})
    if (FIX === '4') document.addEventListener('pointerup', prelift, {capture: true, passive: true})

    /* ---- 追踪一次聚焦 ---- */
    var tracing = false

    function trace(which) {
        if (tracing) return
        tracing = true

        var before = full()
        var t0 = performance.now()
        var samples = []
        var lastKey = ''
        var settle = 0
        var moved = false
        var topMin = before.topbarTop, topMax = before.topbarTop

        function tick() {
            var now = performance.now() - t0
            var q = quick()
            if (q.top != null) { topMin = Math.min(topMin, q.top); topMax = Math.max(topMax, q.top) }

            var key = [q.vvH, q.vvOff, q.docH, q.top, q.tab, q.kbEnv, q.scrollY].join('|')
            if (key !== lastKey) {
                if (samples.length < 80) samples.push({t: Math.round(now), v: q})
                lastKey = key
                settle = now
            }
            if (!moved) {
                if ((before.vvH != null && q.vvH != null && before.vvH - q.vvH > 100)
                    || before.docH - q.docH > 100
                    || (q.kbEnv !== 12345 && q.kbEnv > 100)
                    || Math.abs((q.vvOff || 0) - (before.vvOff || 0)) > 40) {
                    moved = true
                }
            }
            paintLive()
            if (now < 2600) requestAnimationFrame(tick)
            else done()
        }

        function done() {
            tracing = false
            if (moved && pendingTapAt && performance.now() - pendingTapAt < 4000) {
                tapsWithKeyboard++
                pendingTapAt = 0
            }
            records.push({
                kind: 'focus', which: which, mode: MODE, fix: FIX, page: PAGE,
                before: before, after: full(),
                settleMs: Math.round(settle), detected: moved,
                topbarRange: [r(topMin), r(topMax)], samples: samples
            })
            paintReport()
            paintLive()
        }

        requestAnimationFrame(tick)
    }

    /* 只监听 focusin：它在系统完成聚焦之后触发，不参与触摸链。 */
    document.addEventListener('focusin', function (e) {
        var id = e.target && e.target.id
        if (id === 'bigInput' || id === 'smallInput' || id === 'ideaBody') trace(id)
    })

    if (vv) {
        vv.addEventListener('resize', onVvResize)
        vv.addEventListener('scroll', onVvScroll)
    }
    /*
     * fix=5：原生收缩 WebView 后布局视口自己变小，外壳的 inset:0 已经等于可见区，
     * Web 侧唯一要做的是让 Tab 在键盘可见时让位——它不再有地方可藏。
     */
    function onNativeResize() {
        layoutH = document.documentElement.clientHeight
        var inset = Math.max(0, r(baseLayoutH - layoutH))
        var root = document.documentElement
        root.style.setProperty('--kb-inset', inset + 'px')
        var on = inset > 100
        root.setAttribute('data-kb', on ? 'on' : 'off')
        if (on) cachedInset = inset
        paintLive()
    }

    window.addEventListener('resize', function () {
        if (FIX === '5') { onNativeResize(); return }
        layoutH = document.documentElement.clientHeight
        onVvResize()
    })

    /* ---- 显示 ---- */
    var liveEl = document.getElementById('live')

    function paintLive() {
        if (!liveEl || getComputedStyle(liveEl).display === 'none') return
        var s = full()
        liveEl.textContent =
            'page/fix  ' + PAGE + ' / ' + FIX + '\n'
            + 'docH      ' + s.docH + '   fixedH ' + s.fixedH + '\n'
            + 'dvh/svh   ' + s.dvh + ' / ' + s.svh + '\n'
            + 'vv h/off  ' + s.vvH + ' / ' + s.vvOff + '\n'
            + 'kb env    ' + s.kbEnv + (s.kbEnv === 12345 ? ' (未支持)' : '') + '\n'
            + 'safe btm  ' + s.safeBottom + '\n'
            + 'topbar y  ' + s.topbarTop + '   tab y ' + s.tabTop + '\n'
            + 'scrollY   ' + s.scrollY + '   遮挡 ' + r(cachedInset) + '\n'
            + '布局基准  ' + baseLayoutH + ' → ' + s.docH + '\n'
            + '点击/呼出 ' + taps + ' / ' + tapsWithKeyboard
    }

    function pad(s) { s = String(s); while (s.length < 10) s += ' '; return s }
    function row(name, b, a) {
        var d = (typeof b === 'number' && typeof a === 'number') ? r(a - b) : ''
        return '        ' + pad(name) + pad(b) + pad(a) + d
    }

    function buildReport() {
        var fixName = (FIXES.filter(function (f) { return f[0] === FIX })[0] || ['', '?'])[1]
        var head = [
            '=== FlowCloudAI 键盘探针 ===',
            'page        ' + PAGE,
            'mode        ' + MODE,
            'fix         ' + FIX + '（' + fixName + '）',
            'ua          ' + navigator.userAgent,
            'dpr         ' + window.devicePixelRatio + '   screen ' + screen.width + 'x' + screen.height,
            'VirtualKbd  supported=' + vkSupported + ' enabled=' + vkEnabled,
            '点击 / 呼出 ' + taps + ' / ' + tapsWithKeyboard + '   （分母是点击次数，落空的点击也计入）',
            '缓存遮挡    ' + r(cachedInset),
            ''
        ].join('\n')

        var body = records.map(function (rec, i) {
            if (rec.kind === 'mark') return '#' + (i + 1) + ' [人工] ' + rec.text + '  @' + rec.page + '/' + rec.fix
            var b = rec.before, a = rec.after
            return [
                '#' + (i + 1) + ' [聚焦] ' + rec.which + '  page=' + rec.page + ' fix=' + rec.fix
                + '  检测到键盘=' + rec.detected + '  稳定=' + rec.settleMs + 'ms',
                '        ' + pad('') + pad('before') + pad('after') + 'delta',
                row('docH', b.docH, a.docH),
                row('dvh', b.dvh, a.dvh),
                row('vv.height', b.vvH, a.vvH),
                row('vv.offsetTop', b.vvOff, a.vvOff),
                row('kbEnv', b.kbEnv, a.kbEnv),
                row('safeBottom', b.safeBottom, a.safeBottom),
                row('topbar.top', b.topbarTop, a.topbarTop),
                row('tab.top', b.tabTop, a.tabTop),
                row('composer.top', b.composerTop, a.composerTop),
                row('ideaBody.top', b.ideaBodyTop, a.ideaBodyTop),
                row('ideaBody.h', b.ideaBodyH, a.ideaBodyH),
                row('scrollY', b.scrollY, a.scrollY),
                '        topbar.top 过程区间 [' + rec.topbarRange[0] + ', ' + rec.topbarRange[1] + ']',
                '        过程采样 ' + rec.samples.length + ' 帧：',
                rec.samples.map(function (s) {
                    return '          +' + s.t + 'ms vvH=' + s.v.vvH + ' vvOff=' + s.v.vvOff
                        + ' top=' + s.v.top + ' tab=' + s.v.tab + ' sy=' + s.v.scrollY
                }).join('\n')
            ].join('\n')
        }).join('\n\n')

        return head + (body || '（没有记录）') + '\n'
    }

    var reportEl = document.getElementById('report')
    function paintReport() {
        if (!reportEl || getComputedStyle(reportEl).display === 'none') return
        reportEl.textContent = records.length ? buildReport() : '（还没有记录）'
    }

    /* ---- 按钮 ---- */
    function go(page, fix, vw) { location.replace('?page=' + page + '&fix=' + fix + '&vw=' + vw) }

    function fill(id, list, current, onPick) {
        var host = document.getElementById(id)
        list.forEach(function (item) {
            var b = document.createElement('button')
            b.textContent = item[1]
            if (item[0] === current) b.className = 'on'
            b.addEventListener('click', function () { onPick(item[0]) })
            host.appendChild(b)
        })
    }
    fill('pageRow', PAGES, PAGE, function (v) { go(v, FIX, MODE) })
    fill('fixRow', FIXES, FIX, function (v) { go(PAGE, v, MODE) })
    fill('modeRow', MODES, MODE, function (v) { go(PAGE, FIX, v) })

    document.getElementById('modeLabel').textContent =
        PAGE + ' · fix=' + FIX + ' · ' + MODE + ' · VK ' + (vkSupported ? '可用' : '不可用')

    document.getElementById('panelBtn').addEventListener('click', function () {
        document.body.classList.toggle('panel-off')
        this.textContent = document.body.classList.contains('panel-off') ? '开面板' : '收面板'
    })

    Array.prototype.forEach.call(document.querySelectorAll('[data-mark]'), function (b) {
        b.addEventListener('click', function () {
            records.push({kind: 'mark', text: b.getAttribute('data-mark'), page: PAGE, fix: FIX})
            b.classList.add('on')
            setTimeout(function () { b.classList.remove('on') }, 400)
            paintReport()
        })
    })

    /* dev 走 http，不是安全上下文，clipboard API 通常不可用，必须有兜底。
       兜底不能依赖 #report——灵感结构下它是 display:none。 */
    document.getElementById('copyBtn').addEventListener('click', function () {
        var text = buildReport()
        var btn = this
        function ok() { btn.textContent = '已复制'; setTimeout(function () { btn.textContent = '复制' }, 1500) }
        function fallback() {
            var tmp = document.createElement('pre')
            tmp.textContent = text
            tmp.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;overflow:hidden;opacity:0;-webkit-user-select:text;user-select:text'
            document.body.appendChild(tmp)
            var range = document.createRange()
            range.selectNodeContents(tmp)
            var sel = window.getSelection()
            sel.removeAllRanges()
            sel.addRange(range)
            var done = false
            try { done = document.execCommand('copy') } catch (e) { done = false }
            sel.removeAllRanges()
            document.body.removeChild(tmp)
            btn.textContent = done ? '已复制' : '复制失败'
            setTimeout(function () { btn.textContent = '复制' }, 1500)
        }
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback)
        else fallback()
    })

    if (FIX === '5') onNativeResize(); else onVvResize()
    paintLive()
    setInterval(paintLive, 500)
})()
</script>
</body>
