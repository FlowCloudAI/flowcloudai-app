<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <!-- 与 app_main/index.html 保持一致，确保基线条件相同。 -->
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
          name="viewport"/>
    <title>移动端键盘空壳</title>
    <style>
        /*
         * 移动端外壳的最小复现：固定顶栏 + 内部滚动区 + 常驻 composer + 底部 Tab。
         * 只有布局，没有任何键盘处理逻辑、没有 JavaScript——它就是待解决的问题本身。
         */
        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #14161a;
            color: #e7ebf0;
            font: 14px/1.5 -apple-system, "SF Pro Text", "Noto Sans SC", system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        #shell {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
        }
        #shell > * { flex: 0 0 auto; }

        #topbar {
            padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
            background: #2b6cff;
            color: #fff;
            font-weight: 600;
        }

        #scroller {
            flex: 1 1 0;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 12px 16px 20px;
        }
        #scroller p { color: #8fa0b6; }

        #composer {
            padding: 10px 16px;
            background: #1d2026;
            border-top: 1px solid #333a45;
        }

        #tabbar {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 52px;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            background: #7a3cff;
            color: #fff;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            background: #0e1013;
            color: #e7ebf0;
            border: 1px solid #3a424f;
            border-radius: 8px;
            padding: 10px;
            font: inherit;
            resize: none;
        }
        #longInput { height: 46vh; }
        #composerInput { height: 40px; }
    </style>
</head>
<body>
<div id="shell">
    <div id="topbar">固定顶栏 — 必须永远可见</div>

    <div id="scroller">
        <p>内部滚动区。下面是一个比键盘上方可视区更高的输入框。</p>
        <textarea id="longInput" placeholder="长输入框"></textarea>
        <p>滚动区里的其他内容。</p>
    </div>

    <div id="composer">
        <textarea id="composerInput" placeholder="底部常驻输入框"></textarea>
    </div>

    <div id="tabbar">底部 Tab</div>
</div>
</body>
</html>
