<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>页面编辑器设计与生产样式对比</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; background: #202228; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
main { display: grid; grid-template-columns: repeat(2, 1440px); gap: 16px; padding: 16px; }
figure { margin: 0; overflow: hidden; background: #fff; }
figcaption { height: 32px; padding: 7px 12px; background: #202228; color: #fff; font-size: 13px; }
img { display: block; width: 1440px; height: 1000px; object-fit: cover; object-position: top left; }
</style>
</head>
<body><main>
<figure><figcaption>已确认设计稿</figcaption><img src="design-wide-light.png" alt="已确认设计稿"></figure>
<figure><figcaption>生产样式静态夹具</figcaption><img src="implementation-wide-light.png" alt="生产样式静态夹具"></figure>
</main></body>
</html>
