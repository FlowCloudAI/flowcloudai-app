<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1440" viewBox="0 0 1440 1440">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#14213d" flood-opacity="0.08"/>
    </filter>
    <g id="plugin" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7.6 8h8.8v4.2a4.4 4.4 0 0 1-8.8 0Z"/>
      <path d="M9.7 4.2V8M14.3 4.2V8M12 16.6v3.2"/>
    </g>
    <g id="thinking" fill="currentColor" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13.3 3.5 6.9 12.6h4.9l-1.1 7.9 6.4-9.4h-4.8Z"/>
    </g>
    <g id="reader" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 8.8C10 7.2 7.6 6.4 4.7 6.4v10.3c2.9 0 5.3.8 7.3 2.5Z"/>
      <path d="M12 8.8c2-1.6 4.4-2.4 7.3-2.4v10.3c-2.9 0-5.3.8-7.3 2.5Z"/>
      <path d="M12 8.8v10.4"/>
    </g>
    <g id="assistant" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.6 19 6.3v5.2c0 4.3-2.8 7.3-7 8.9-4.2-1.6-7-4.6-7-8.9V6.3Z"/>
      <path d="m8.4 11.9 2.3 2.3 4.9-4.9"/>
    </g>
    <g id="writer" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="m5 19 1.2-4.7L15.5 5a1.6 1.6 0 0 1 2.3 0L19 6.2a1.6 1.6 0 0 1 0 2.3l-9.3 9.3Z"/>
      <path d="m14.4 6.1 3.5 3.5M6.2 14.3l3.5 3.5M5 19l4.7-1.2"/>
    </g>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Noto Sans SC", sans-serif; fill: #17191f; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Noto Sans SC", sans-serif; fill: #697181; }
      .section { font: 650 19px -apple-system, BlinkMacSystemFont, "Noto Sans SC", sans-serif; fill: #17191f; }
      .label { font: 650 20px -apple-system, BlinkMacSystemFont, "Noto Sans SC", sans-serif; fill: #17191f; }
      .note { font: 400 15px -apple-system, BlinkMacSystemFont, "Noto Sans SC", sans-serif; fill: #697181; }
      .chip { font: 600 18px -apple-system, BlinkMacSystemFont, "Noto Sans SC", sans-serif; }
      .menu-title { font: 650 19px -apple-system, BlinkMacSystemFont, "Noto Sans SC", sans-serif; fill: #17191f; }
      .menu-subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Noto Sans SC", sans-serif; fill: #697181; }
    </style>
  </defs>

  <rect width="1440" height="1080" fill="#f5f7fa"/>
  <text class="title" x="72" y="70">FlowCloudAI · AI 操作图标审计稿 A</text>
  <text class="subtitle" x="72" y="104">统一参数：24×24 viewBox · 思考为实心 + 2.1px 描边 · 其余 2.1px 描边 · 优先保证 18–20px 下辨识度</text>

  <text class="section" x="72" y="157">界面实际尺寸预览</text>
  <g filter="url(#shadow)">
    <rect x="72" y="184" width="430" height="142" rx="24" fill="#fff" stroke="#d9dee7"/>
    <g transform="translate(105 221) scale(1.08)" color="#3489e5"><use href="#plugin"/></g>
    <text class="menu-title" x="153" y="238">切换插件</text>
    <text class="menu-subtitle" x="153" y="269">DeepSeek LLM</text>
    <path d="M100 292h374" stroke="#e7eaf0"/>
  </g>

  <g transform="translate(548 197)">
    <rect width="136" height="46" rx="23" fill="#edf5ff" stroke="#9bc9fb" stroke-width="1.5"/>
    <g transform="translate(14 11)" color="#3489e5"><use href="#thinking"/></g>
    <text class="chip" x="50" y="30" fill="#3489e5">思考</text>
  </g>
  <g transform="translate(704 197)">
    <rect width="156" height="46" rx="23" fill="#edf5ff" stroke="#9bc9fb" stroke-width="1.5"/>
    <g transform="translate(14 11)" color="#3489e5"><use href="#reader"/></g>
    <text class="chip" x="50" y="30" fill="#3489e5">读者</text>
  </g>
  <g transform="translate(880 197)">
    <rect width="156" height="46" rx="23" fill="#edf5ff" stroke="#9bc9fb" stroke-width="1.5"/>
    <g transform="translate(14 11)" color="#3489e5"><use href="#assistant"/></g>
    <text class="chip" x="50" y="30" fill="#3489e5">助手</text>
  </g>
  <g transform="translate(1056 197)">
    <rect width="156" height="46" rx="23" fill="#edf5ff" stroke="#9bc9fb" stroke-width="1.5"/>
    <g transform="translate(14 11)" color="#3489e5"><use href="#writer"/></g>
    <text class="chip" x="50" y="30" fill="#3489e5">作家</text>
  </g>
  <text class="note" x="548" y="278">左侧为约 24px 图标槽预览；最终接入时仍由现有 CSS 控制实际尺寸与颜色。</text>

  <text class="section" x="72" y="386">轮廓放大检查</text>

  <g transform="translate(72 416)" filter="url(#shadow)">
    <rect width="240" height="500" rx="28" fill="#fff" stroke="#d9dee7"/>
    <g transform="translate(72 62) scale(4)" color="#3489e5"><use href="#plugin"/></g>
    <g transform="translate(108 196)" color="#3489e5"><use href="#plugin"/></g>
    <text class="label" x="28" y="265">切换插件</text>
    <text class="note" x="28" y="302">插头轮廓取代块状十字，</text>
    <text class="note" x="28" y="326">减少“医疗 / 添加”歧义。</text>
    <text class="note" x="28" y="372">审计：插头语义是否足够</text>
    <text class="note" x="28" y="396">表达“插件”。</text>
  </g>

  <g transform="translate(336 416)" filter="url(#shadow)">
    <rect width="240" height="500" rx="28" fill="#fff" stroke="#d9dee7"/>
    <g transform="translate(72 62) scale(4)" color="#3489e5"><use href="#thinking"/></g>
    <g transform="translate(108 196)" color="#3489e5"><use href="#thinking"/></g>
    <text class="label" x="28" y="265">思考</text>
    <text class="note" x="28" y="302">内部实心消除割裂感，同时</text>
    <text class="note" x="28" y="326">保留原描边完善外轮廓。</text>
    <text class="note" x="28" y="372">审计：填充 + 描边的重量</text>
    <text class="note" x="28" y="396">是否仍与其余图标协调。</text>
  </g>

  <g transform="translate(600 416)" filter="url(#shadow)">
    <rect width="240" height="500" rx="28" fill="#fff" stroke="#d9dee7"/>
    <g transform="translate(72 62) scale(4)" color="#3489e5"><use href="#reader"/></g>
    <g transform="translate(108 196)" color="#3489e5"><use href="#reader"/></g>
    <text class="label" x="28" y="265">读者模式</text>
    <text class="note" x="28" y="302">保留打开的书，删除内部</text>
    <text class="note" x="28" y="326">装饰线，轮廓更安静。</text>
    <text class="note" x="28" y="372">语义：只读取，不写入。</text>
  </g>

  <g transform="translate(864 416)" filter="url(#shadow)">
    <rect width="240" height="500" rx="28" fill="#fff" stroke="#d9dee7"/>
    <g transform="translate(72 62) scale(4)" color="#3489e5"><use href="#assistant"/></g>
    <g transform="translate(108 196)" color="#3489e5"><use href="#assistant"/></g>
    <text class="label" x="28" y="265">助手模式</text>
    <text class="note" x="28" y="302">盾牌 + 对钩代表写入前</text>
    <text class="note" x="28" y="326">确认，比眼镜形态更明确。</text>
    <text class="note" x="28" y="372">语义：受保护、需确认。</text>
  </g>

  <g transform="translate(1128 416)" filter="url(#shadow)">
    <rect width="240" height="500" rx="28" fill="#fff" stroke="#d9dee7"/>
    <g transform="translate(72 62) scale(4)" color="#3489e5"><use href="#writer"/></g>
    <g transform="translate(108 196)" color="#3489e5"><use href="#writer"/></g>
    <text class="label" x="28" y="265">作家模式</text>
    <text class="note" x="28" y="302">用简化铅笔替代羽毛笔，</text>
    <text class="note" x="28" y="326">降低细节密度与叶片感。</text>
    <text class="note" x="28" y="372">语义：直接编辑、写入。</text>
  </g>

  <text class="section" x="72" y="1000">请优先审计</text>
  <rect x="72" y="1026" width="1296" height="186" rx="24" fill="#fff" stroke="#d9dee7"/>
  <text class="note" x="104" y="1070">1. “切换插件”用插头是否比拼图块更直接，还是仍希望保留“拼图”隐喻？</text>
  <text class="note" x="104" y="1105">2. “思考”填充 + 描边闪电的宽度、倾斜与视觉重量是否合适？</text>
  <text class="note" x="104" y="1140">3. 三种模式采用“书 / 盾牌对钩 / 铅笔”的权限递进语义是否清楚？</text>
  <text class="note" x="104" y="1175">回复图标名称和调整方向即可；确认前不会接入应用代码。</text>

  <rect x="72" y="1294" width="1296" height="74" rx="20" fill="#17191f"/>
  <g transform="translate(102 1319)" color="#f4f7fb"><use href="#plugin"/></g>
  <g transform="translate(160 1319)" color="#f4f7fb"><use href="#thinking"/></g>
  <g transform="translate(218 1319)" color="#f4f7fb"><use href="#reader"/></g>
  <g transform="translate(276 1319)" color="#f4f7fb"><use href="#assistant"/></g>
  <g transform="translate(334 1319)" color="#f4f7fb"><use href="#writer"/></g>
  <text x="406" y="1338" font-family="-apple-system, BlinkMacSystemFont, Noto Sans SC, sans-serif" font-size="16" fill="#cbd2de">暗色背景快速检查：思考为填充 + 描边，其余保持描边；五枚图标的视觉重量保持在同一档。</text>
</svg>
