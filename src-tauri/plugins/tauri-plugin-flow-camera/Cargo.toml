[package]
name = "tauri-plugin-flow-camera"
version = "0.1.0"
description = "FlowCloudAI Android system camera bridge"
edition = "2024"
links = "tauri-plugin-flow-camera"

[lib]
name = "tauri_plugin_flow_camera"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", default-features = false }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
serde_json = "1"
